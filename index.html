
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who Took My Latte?</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="story-container">

        <h1>Who Took My Latte?</h1>

        <p id="progress">Opening Scene</p>

        <div class="story-image-container">
            <img id="storyImage"
                src="images/First Scene Cafe.jpeg"
                alt="Inside the cafe">
        </div>

        <h2 id="storyTitle">Welcome to the Cafe</h2>

        <p id="storyText">
            A mystery is waiting to be solved.
        </p>

        <div id="storyChoices" class="choices"></div>

        <section id="clueCollection">
            <h3>Clues Collected: <span id="clueCount">0</span>/5</h3>
            <ul id="clueList"></ul>
        </section>

        <button id="restartButton" type="button">
            Restart Mystery
        </button>

    </main>

</body>
</html>
